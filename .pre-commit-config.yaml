# Install once with `uv run pre-commit install`. Run everything with `uv run pre-commit run --all-files`.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--unsafe]  # mkdocs.yml uses !!python tags
      - id: check-toml
      - id: check-added-large-files
        args: [--maxkb=1024]
        exclude: ^docs/code-db/.*\.html$
      - id: check-merge-conflict

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.3
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: mypy
        name: mypy (strict, src/)
        entry: uv run mypy
        language: system
        types: [python]
        pass_filenames: false
        files: ^src/
      - id: jupytext-sync
        name: jupytext pairing
        entry: uv run jupytext --sync
        language: system
        files: ^notebooks/.*\.py$
      - id: clang-format
        name: clang-format (HLS C++)
        entry: scripts/hw-lint.sh clang-format -i
        language: system
        types_or: [c, c++]
      - id: verible-lint
        name: verible lint (Verilog)
        entry: scripts/hw-lint.sh verible-verilog-lint
        language: system
        types_or: [verilog, system-verilog]
      - id: verible-format
        name: verible format (Verilog)
        entry: scripts/hw-lint.sh verible-verilog-format --inplace
        language: system
        types_or: [verilog, system-verilog]
