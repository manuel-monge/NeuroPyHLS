# Built with Zensical (`uv run --group docs zensical build`).
# Kept within what Material for MkDocs also understands, as a fallback.
site_name: NeuroPyHLS
site_description: High-level synthesis of neural-signal algorithms directly from Python to Verilog.
site_url: https://openic-org.github.io/NeuroPyHLS/
repo_url: https://github.com/openic-org/NeuroPyHLS
repo_name: openic-org/NeuroPyHLS
edit_uri: edit/main/docs/
copyright: Code Apache-2.0 · Docs CC-BY-4.0 · OpenIC

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - content.code.copy
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle: { icon: material/brightness-7, name: Switch to dark mode }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle: { icon: material/brightness-4, name: Switch to light mode }

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc: { permalink: true }
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.snippets: { base_path: ["."], check_paths: true }

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Pipeline: pipeline.md
  - Kernels:
      - kernels/index.md
      - Bandpass + threshold: kernels/bandpass-threshold.md
  - Results:
      - results/index.md
      - Summary: results/summary.md
  - Research:
      - Code databases: code-db/index.md
      - Literature database: lit-db/index.md
  - Reference:
      - CLI: reference/cli.md
  - About:
      - AI contributions: about/ai-contributions.md
      - Licensing: about/licensing.md
