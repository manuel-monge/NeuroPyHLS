<title>SpikeInterface Algorithm Atlas</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: two-pane instrument — algorithm index on the left, detail sheet on the right; stacks on phones. */
:root {
  --bg: #f5f6f8; --panel: #ffffff; --fg: #1b1f2a; --muted: #5d6475; --line: #dde1e8; --soft: #eceff4;
  --accent: #2f4fcf; --accent-soft: #e3e8fb; --warm: #b5660f; --ok: #237a4b;
  --d0: #2f4fcf; --d1: #6c84e0; --d2: #a3b2ec; --d3: #ccd4f3;
  --f-display: "IBM Plex Sans Condensed", "Arial Narrow", system-ui, sans-serif;
  --f-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #12141a; --panel: #1a1d25; --fg: #e4e7ef; --muted: #98a0b3; --line: #2c3140; --soft: #232733;
  --accent: #8ea2ff; --accent-soft: #263055; --warm: #e6a04d; --ok: #5cc48b;
  --d0: #8ea2ff; --d1: #6a7cc8; --d2: #4a5893; --d3: #353f69; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #12141a; --panel: #1a1d25; --fg: #e4e7ef; --muted: #98a0b3; --line: #2c3140; --soft: #232733;
  --accent: #8ea2ff; --accent-soft: #263055; --warm: #e6a04d; --ok: #5cc48b;
  --d0: #8ea2ff; --d1: #6a7cc8; --d2: #4a5893; --d3: #353f69; color-scheme: dark; }
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font: 14px/1.5 var(--f-body); }
.wrap { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 20px 40px; max-width: 1400px; margin: 0 auto; }
header { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px 24px; margin-bottom: 16px; }
h1 { font: 600 26px/1.1 var(--f-display); margin: 0; letter-spacing: -0.01em; text-wrap: balance; }
.sub { color: var(--muted); font-size: 13px; margin-top: 4px; }
.mono { font-family: var(--f-mono); font-size: 12.5px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--panel); }
.seg button { border: 0; background: none; color: var(--fg); font: 500 13px var(--f-body); padding: 7px 12px; cursor: pointer; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--panel); }
button:focus-visible, input:focus-visible, select:focus-visible, .item:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.grid { display: grid; grid-template-columns: 320px minmax(0, 1fr); gap: 16px; align-items: start; }
@media (max-width: 860px) { .grid { grid-template-columns: minmax(0, 1fr); } .side { max-height: 360px; } }
.side { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; display: flex; flex-direction: column; max-height: calc(100vh - 120px); position: sticky; top: calc(env(safe-area-inset-top, 0px) + 12px); }
@media (max-width: 860px) { .side { position: static; } }
.side .tools { padding: 10px; border-bottom: 1px solid var(--line); display: grid; gap: 8px; }
input[type=search], select { width: 100%; font: 14px var(--f-body); padding: 7px 10px; border: 1px solid var(--line); border-radius: 7px; background: var(--bg); color: var(--fg); }
.list { overflow-y: auto; padding: 4px 0 8px; }
.grp { font: 600 11px var(--f-body); text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); padding: 10px 12px 4px; display: flex; justify-content: space-between; }
.item { display: flex; justify-content: space-between; gap: 8px; padding: 5px 12px; cursor: pointer; border-left: 3px solid transparent; }
.item:hover { background: var(--soft); }
.item[aria-selected="true"] { background: var(--accent-soft); border-left-color: var(--accent); }
.item .n { color: var(--muted); font-family: var(--f-mono); font-size: 11.5px; white-space: nowrap; }
.item .t { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.main { min-width: 0; display: grid; gap: 14px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px; min-width: 0; }
.card h2 { font: 600 20px/1.2 var(--f-display); margin: 0; }
.card h3 { font: 600 13px var(--f-body); text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); margin: 0 0 10px; display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.pills { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
.pill { font: 500 12px var(--f-body); padding: 2px 8px; border-radius: 99px; background: var(--soft); color: var(--fg); border: 1px solid var(--line); }
.pill.type { background: var(--accent-soft); border-color: transparent; color: var(--accent); }
.pill.warm { color: var(--warm); }
.doc { color: var(--muted); margin: 6px 0 0; }
.kv { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 4px 12px; margin-top: 10px; font-size: 13px; }
.kv dt { color: var(--muted); } .kv dd { margin: 0; overflow-wrap: anywhere; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; }
.stat { border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; }
.stat b { font: 600 22px var(--f-display); font-variant-numeric: tabular-nums; display: block; }
.stat span { color: var(--muted); font-size: 12px; }
.two { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 14px; }
@media (max-width: 420px) { .two { grid-template-columns: minmax(0, 1fr); } }
.bars { display: grid; gap: 5px; }
.bar { display: grid; grid-template-columns: minmax(90px, 34%) minmax(0, 1fr) 48px; gap: 8px; align-items: center; font-size: 13px; }
.bar .lbl { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bar .track { height: 10px; background: var(--soft); border-radius: 3px; overflow: hidden; }
.bar .fill { height: 100%; border-radius: 3px; }
.bar .v { text-align: right; font-family: var(--f-mono); font-size: 12px; font-variant-numeric: tabular-nums; color: var(--muted); }
.scroll { overflow-x: auto; max-height: 420px; overflow-y: auto; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th { text-align: left; font: 600 11.5px var(--f-body); color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; padding: 6px 8px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--panel); cursor: pointer; white-space: nowrap; }
td { padding: 5px 8px; border-bottom: 1px solid var(--soft); vertical-align: top; }
td.num { text-align: right; font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.dep { display: inline-block; width: 18px; height: 18px; line-height: 18px; text-align: center; border-radius: 4px; font: 600 11px var(--f-mono); color: var(--panel); }
.d0 { background: var(--d0); } .d1 { background: var(--d1); } .d2 { background: var(--d2); color: var(--fg); } .d3 { background: var(--d3); color: var(--fg); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font: 12px var(--f-mono); padding: 2px 7px; border-radius: 5px; background: var(--soft); border: 1px solid var(--line); color: var(--fg); }
button.chip { cursor: pointer; } button.chip:hover { border-color: var(--accent); }
.chip i { font-style: normal; color: var(--muted); margin-left: 4px; }
.legend { display: flex; gap: 10px; align-items: center; font-size: 12px; color: var(--muted); flex-wrap: wrap; }
.prim-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 12px 18px; }
.prim-grid h4 { margin: 0 0 4px; font: 600 12.5px var(--f-body); }
.empty { color: var(--muted); font-style: italic; }
.hint { color: var(--muted); font-size: 12.5px; }
@media (prefers-reduced-motion: no-preference) { .fill { transition: width .25s ease; } }
</style>

<div class="wrap">

      </div>
      <div class="list" id="list" role="listbox" aria-label="Items"></div>

    <section class="main" id="main"></section>
  </div>
</div>

function renderList() {

  let html = "";
  if (mode === "algo") {
    const groups = {};

      if (q && !(a.name + " " + a.type + " " + a.entry + " " + a.subtype).toLowerCase().includes(q)) continue;
      (groups[a.type] ??= []).push(a);
    }
    for (const [g, arr] of Object.entries(groups).sort()) {
      html += `<div class="grp"><span>${esc(g)}</span><span>${arr.length}</span></div>`;
      for (const a of arr) html += `<div class="item" role="option" tabindex="0" data-id="${esc(a.id)}" aria-selected="${a.id === sel}">
        <span class="t">${esc(a.name)}</span><span class="n">${a.reach} fn</span></div>`;
    }
  } else {
    const t = document.getElementById("etype").value, k = ti[t];
    const counts = new Map();
    for (const a of D.algorithms) for (const r of a.rows) if (r[0] === k && r[2] <= depth) counts.set(r[1], (counts.get(r[1]) || 0) + 1);
    const items = [...counts.entries()].filter(([i]) => !q || E[t][i].join(" ").toLowerCase().includes(q))
      .sort((x, y) => y[1] - x[1]).slice(0, 400);
    html += `<div class="grp"><span>${esc(document.getElementById("etype").selectedOptions[0].text)}</span><span>used by n algorithms</span></div>`;

      <span class="t mono">${esc(E[t][i][0])}</span><span class="n">${n}</span></div>`;

}

function sortable(id, cols, rows) {
  const st = sortable.state[id] ??= { k: cols.findIndex(c => c.sort) , dir: -1 };
  const k = st.k < 0 ? 0 : st.k;
  rows.sort((a, b) => { const x = a[k], y = b[k]; return (typeof x === "number" ? x - y : String(x).localeCompare(String(y))) * st.dir; });
  return `<div class="scroll"><table data-tbl="${id}"><thead><tr>${cols.map((c, i) => `<th data-k="${i}" class="${c.num ? "num" : ""}" aria-sort="${i === k ? (st.dir > 0 ? "ascending" : "descending") : "none"}">${esc(c.h)}${i === k ? (st.dir > 0 ? " ▲" : " ▼") : ""}</th>`).join("")}</tr></thead>
    <tbody>${rows.map(r => `<tr>${cols.map((c, i) => `<td class="${c.num ? "num" : ""}">${c.f ? c.f(r[i], r) : esc(r[i])}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
}
